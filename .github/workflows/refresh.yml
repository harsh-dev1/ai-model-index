name: Refresh data

on:
  schedule:
    # Every 6 hours. Sources update at most daily, so this is gentle on them while
    # keeping the site's staleness badge under a quarter of a day.
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch sources
        run: pnpm data:fetch

      - name: Extend Arena history
        run: pnpm data:backfill

      - name: Join and score
        run: pnpm normalize && pnpm score

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "No change in the data; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A run that produced neither a commit nor an error is a silent failure, and the
      # done-bar treats silent failures as red. Fail loudly if the data has not moved in
      # over two days.
      - name: Guard against a silently stalled feed
        run: |
          NEWEST=$(ls data/raw/epoch | sort | tail -1 | cut -d. -f1)
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$NEWEST" +%s) ) / 86400 ))
          echo "Newest Epoch snapshot: $NEWEST (${AGE}d old)"
          if [ "$AGE" -gt 2 ]; then
            echo "::error::Data has not refreshed in ${AGE} days — the feed is stalled."
            exit 1
          fi

  # New data is worthless until it is published, and the commit above cannot trigger the
  # push workflow on its own.
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
